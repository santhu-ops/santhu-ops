<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.fl{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:26px;fill:#38BDF8;opacity:.16;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.name{stroke-dasharray:900;stroke-dashoffset:0;animation:draw 3.2s cubic-bezier(.6,0,.2,1) 1.2s both}
@keyframes draw{from{stroke-dashoffset:900;fill-opacity:0}60%{stroke-dashoffset:0;fill-opacity:0}to{stroke-dashoffset:0;fill-opacity:1}}
.gl{animation:gin 1.2s ease 3.2s both}
@keyframes gin{from{opacity:0}to{opacity:1}}
.gp{opacity:.55;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.85}}
.role{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:20px;fill:#94a3b8;opacity:0;animation:role 12s ease infinite both}
.r1{opacity:1;animation-delay:5s}.r2{animation-delay:9s}.r3{animation-delay:13s}
@keyframes role{0%{opacity:0;transform:translateY(12px)}6%{opacity:1;transform:translateY(0)}28%{opacity:1;transform:translateY(0)}34%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
.rise{animation:rise 1s ease 4.4s both}
@keyframes rise{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
